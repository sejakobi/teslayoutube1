<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020408">
  <title>CYBER.play — Kanal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #020408;
      --panel: rgba(13, 17, 28, 0.68);
      --panel2: rgba(20, 26, 42, 0.75);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f0f4f9;
      --muted: #8392a7;
      --cyan: #00f0ff;
      --red: #ff0033;
      --tesla: #e82127;
      --blur: 20px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(232, 33, 39, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
        linear-gradient(to bottom, rgba(2,4,8,0.8), #020408);
      background-attachment: fixed;
    }

    /* Cyber Gitter-Overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image: 
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, #000, transparent 80%);
    }

    /* --- TESLA x YOUTUBE BOOTUP INTRO --- */
    #cyber-intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: introFadeOut 0.8s cubic-bezier(0.77, 0, 0.175, 1) 2.6s forwards;
      pointer-events: none;
    }

    .intro-logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }

    .tesla-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 0.6em;
      color: var(--tesla);
      text-transform: uppercase;
      opacity: 0;
      animation: pulseText 1.5s ease-in-out 0.2s infinite alternate, fadeIn 0.4s 0.1s forwards;
    }

    .cyber-brand-intro {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
      text-shadow: 0 0 30px rgba(255, 0, 51, 0.6);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: scale(0.9);
      animation: zoomInLogo 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .cyber-brand-intro span { color: var(--red); }

    .intro-progress-bar {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 15px;
    }

    .intro-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--tesla), var(--red), var(--cyan));
      box-shadow: 0 0 15px var(--red);
      animation: fillProgress 1.8s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards;
    }

    @keyframes fillProgress { 0% { width: 0%; } 100% { width: 100%; } }
    @keyframes zoomInLogo { to { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes pulseText { from { opacity: 0.4; } to { opacity: 1; text-shadow: 0 0 10px var(--tesla); } }
    @keyframes introFadeOut { to { opacity: 0; visibility: hidden; } }

    a { color: inherit; text-decoration: none; }
    
    .page {
      max-width: 1440px;
      margin: auto;
      padding: 22px clamp(14px, 3vw, 42px) 60px;
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .14em;
    }

    .brand span { color: var(--red); }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: all 0.25s ease;
    }

    .back:hover {
      border-color: var(--cyan);
      background: rgba(0, 240, 255, 0.1);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    /* --- HERO --- */
    .hero {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 32px;
      align-items: center;
      padding: clamp(24px, 4vw, 42px);
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(125deg, rgba(232, 33, 39, 0.12), rgba(13, 17, 28, 0.82) 55%, rgba(0, 240, 255, 0.05));
      box-shadow: 0 24px 60px rgba(0,0,0,0.7);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      overflow: hidden;
    }

    .avatar {
      width: clamp(90px, 12vw, 150px);
      aspect-ratio: 1;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
      background: #202b3b;
    }

    .channel-name {
      font-family: 'Syne', sans-serif;
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 800;
      line-height: 1.15;
      margin: 0 0 10px;
      overflow-wrap: anywhere;
      color: #fff;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      color: var(--muted);
      font: 700 11px 'Orbitron', sans-serif;
      letter-spacing: 1px;
      margin: 10px 0 16px;
    }

    .desc {
      color: #a8b4c5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-width: 100ch;
      max-height: 7.5em;
      overflow: auto;
      font-size: 15px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 30px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      font: 700 11px 'Orbitron', sans-serif;
      letter-spacing: 1px;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      color: #fff;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .btn.primary {
      color: #fff;
      background: linear-gradient(135deg, var(--red), var(--tesla));
      border-color: transparent;
      box-shadow: 0 4px 16px rgba(255, 0, 51, 0.4);
    }

    .btn.primary:hover {
      filter: brightness(1.15);
      box-shadow: 0 6px 20px rgba(255, 0, 51, 0.6);
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin: 40px 0 20px;
    }

    .section-head h2 {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      margin: 0;
    }

    .sub {
      color: var(--cyan);
      font: 700 10px 'Orbitron', sans-serif;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    /* --- VIDEO GRID --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
    }

    .video {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      background: rgba(13, 17, 28, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .video:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(255, 0, 51, 0.5);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 0, 51, 0.2);
      background: rgba(20, 26, 42, 0.7);
    }

    .thumb {
      position: relative;
      aspect-ratio: 16/9;
      background: #090d14;
      overflow: hidden;
    }

    .thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .video:hover .thumb img {
      transform: scale(1.08);
    }

    .duration {
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      font: 700 10px 'Orbitron', sans-serif;
    }

    .vbody {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .vtitle {
      font: 700 16px/1.3 'Rajdhani', sans-serif;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.6em;
    }

    .vmeta {
      margin-top: auto;
      color: var(--muted);
      font: 700 9px 'Orbitron', sans-serif;
      letter-spacing: .1em;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .message {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
      background: var(--panel);
      backdrop-filter: blur(15px);
      font-size: 16px;
    }

    .hidden { display: none !important; }
    
    .loadrow {
      text-align: center;
      padding: 24px;
      color: var(--cyan);
      font: 700 12px 'Orbitron', sans-serif;
      letter-spacing: 1px;
    }

    .error { color: var(--red); }

    @media(max-width: 1050px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    }

    @media(max-width: 700px) {
      .page { padding-top: 14px; }
      .hero { grid-template-columns: 1fr; text-align: center; justify-items: center; }
      .avatar { width: 110px; }
      .desc { text-align: left; }
      .stats, .actions { justify-content: center; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .vbody { padding: 12px; }
      .vtitle { font-size: 14px; }
    }

    @media(max-width: 390px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- TESLA x YOUTUBE BOOTUP ANIMATION -->
  <div id="cyber-intro">
    <div class="intro-logo-wrap">
      <div class="tesla-badge">TESLA × YOUTUBE MEDIA SYSTEM</div>
      <div class="cyber-brand-intro">CYBER<span>.play</span></div>
      <div class="intro-progress-bar">
        <div class="intro-progress-fill"></div>
      </div>
    </div>
  </div>

  <main class="page">
    <header class="topbar">
      <a class="brand" href="/">CYBER<span>.play</span></a>
      <a class="back" href="/">← ZUR SUCHE</a>
    </header>

    <section id="channel-hero" class="hero" aria-live="polite">
      <img id="channel-avatar" class="avatar" alt="Kanalprofilbild" src="">
      <div>
        <h1 id="channel-name" class="channel-name">Kanal wird geladen …</h1>
        <div id="channel-stats" class="stats"></div>
        <div id="channel-description" class="desc"></div>
        <div class="actions">
          <a id="youtube-channel" class="btn primary" href="#" target="_blank" rel="noopener noreferrer">AUF YOUTUBE ÖFFNEN ↗</a>
          <a class="btn" href="/">← ZURÜCK ZUR SUCHE</a>
        </div>
      </div>
    </section>

    <div class="section-head">
      <div>
        <h2>Videos dieses Kanals</h2>
        <div id="video-subtitle" class="sub">NEUESTE UPLOADS</div>
      </div>
    </div>

    <section id="channel-videos" class="grid" aria-live="polite"></section>
    <div id="channel-message" class="message">Kanal wird geladen …</div>
    <div id="channel-load" class="loadrow"></div>
    <div id="channel-sentinel" style="height:1px"></div>
  </main>

  <script src="/static/channel.js?v=1" defer></script>
</body>
</html>
