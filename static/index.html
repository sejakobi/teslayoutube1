<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020408">
<title>CYBER.play — Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
/* --- CYBER.PLAY CORE THEME --- */
:root {
  color-scheme: dark;
  --bg: #020408;
  --panel: rgba(13, 17, 28, 0.65);
  --panel-border: rgba(255, 255, 255, 0.1);
  --line: rgba(255, 255, 255, 0.1);
  --red: #ff0033;
  --tesla: #e82127;
  --cyan: #00f0ff;
  --purple: #8a2be2;
  --text: #f0f4f9;
  --muted: #8392a7;
  --blur: 20px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  background: var(--bg);
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(232, 33, 39, 0.12) 0%, transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
    linear-gradient(to bottom, rgba(2,4,8,.8), #020408);
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .16;
  background-image: 
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: linear-gradient(to bottom, #000, transparent 80%);
}

a { color: inherit; }

/* --- TESLA x YOUTUBE BOOTUP INTRO --- */
#cyber-intro {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: introFadeOut 0.8s cubic-bezier(0.77, 0, 0.175, 1) 2.6s forwards;
  pointer-events: none;
}

.intro-logo-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
}

.tesla-badge {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 0.6em;
  color: var(--tesla);
  text-transform: uppercase;
  opacity: 0;
  animation: pulseText 1.5s ease-in-out 0.2s infinite alternate, fadeIn 0.4s 0.1s forwards;
}

.cyber-brand-intro {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(32px, 5vw, 56px);
  font-weight: 900;
  letter-spacing: -0.02em;
  color: #fff;
  text-shadow: 0 0 30px rgba(255, 0, 51, 0.6);
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transform: scale(0.9);
  animation: zoomInLogo 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
}

.cyber-brand-intro span { color: var(--red); }

.intro-progress-bar {
  width: 180px;
  height: 3px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 15px;
}

.intro-progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--tesla), var(--red), var(--cyan));
  box-shadow: 0 0 15px var(--red);
  animation: fillProgress 1.8s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards;
}

@keyframes fillProgress { 0% { width: 0%; } 100% { width: 100%; } }
@keyframes zoomInLogo { to { opacity: 1; transform: scale(1); } }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes pulseText { from { opacity: 0.4; } to { opacity: 1; text-shadow: 0 0 10px var(--tesla); } }
@keyframes introFadeOut { to { opacity: 0; visibility: hidden; } }

/* --- SHELL & HEADER --- */
.shell {
  position: relative;
  max-width: 1480px;
  margin: auto;
  padding: 0 28px 44px;
}

.cyber-header {
  position: sticky;
  top: 0;
  z-index: 50;
  margin: 0 -28px;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  background: rgba(2, 4, 8, 0.82);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  font: 900 19px 'Orbitron', sans-serif;
  letter-spacing: .8px;
  white-space: nowrap;
}

.brand-mark {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--tesla), var(--red));
  box-shadow: 0 0 22px rgba(255, 0, 51, 0.4);
  color: white;
  font-size: 23px;
}

.brand em {
  color: var(--red);
  font-style: normal;
}

.eyebrow {
  font: 700 9px 'Orbitron', sans-serif;
  letter-spacing: 2px;
  color: var(--cyan);
  white-space: nowrap;
  background: rgba(0, 240, 255, 0.08);
  padding: 4px 10px;
  border-radius: 12px;
  border: 1px solid rgba(0, 240, 255, 0.2);
}

.search-container {
  flex: 1;
  max-width: 720px;
}

.search-form {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px 7px 18px;
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 50px;
  background: rgba(18, 24, 38, .7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: inset 0 0 12px #0008;
  transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
}

.search-form:focus-within {
  border-color: var(--red);
  box-shadow: 0 0 24px rgba(255, 0, 51, 0.35), inset 0 0 12px #0008;
}

.search-icon {
  font-size: 24px;
  color: var(--muted);
  line-height: 1;
}

.search-form input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: 0;
  color: white;
  font: 600 17px 'Rajdhani', sans-serif;
  user-select: text;
}

.search-form input::placeholder { color: var(--muted); }

.search-button {
  border: 0;
  border-radius: 40px;
  padding: 12px 22px;
  color: white;
  background: linear-gradient(135deg, var(--red), var(--tesla));
  font: 800 10px 'Orbitron', sans-serif;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255, 0, 51, 0.4);
  white-space: nowrap;
  transition: all .2s ease;
}

.search-button:hover {
  filter: brightness(1.15);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 0, 51, 0.6);
}

.search-button:disabled {
  opacity: .55;
  cursor: wait;
  transform: none;
}

/* --- HERO BANNER --- */
.hero {
  position: relative;
  overflow: hidden;
  margin: 34px 0 34px;
  padding: clamp(26px, 5vw, 54px);
  border-radius: 26px;
  border: 1px solid rgba(255, 255, 255, .11);
  background: linear-gradient(125deg, rgba(232, 33, 39, .17), rgba(13, 17, 28, .83) 52%, rgba(0, 240, 255, .06));
  box-shadow: 0 24px 55px #0007;
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
}

.hero::after {
  content: "";
  position: absolute;
  width: 370px;
  height: 370px;
  right: -100px;
  top: -190px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 240, 255, 0.15), transparent 70%);
  pointer-events: none;
}

.overline {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--cyan);
  font: 700 10px 'Orbitron', sans-serif;
  letter-spacing: 2.5px;
  margin-bottom: 18px;
}

.pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 12px var(--red);
  animation: pulse 1.5s infinite;
}

@keyframes pulse { 50% { opacity: .35; box-shadow: 0 0 2px var(--red); } }

h1 {
  position: relative;
  margin: 0 0 18px;
  font: 800 clamp(38px, 6vw, 76px)/.98 'Syne', sans-serif;
  letter-spacing: -2px;
}

h1 em {
  font-style: normal;
  background: linear-gradient(90deg, #fff 5%, var(--red) 55%, var(--cyan));
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
}

.intro {
  max-width: 680px;
  margin: 0;
  color: #a8b4c5;
  font-size: 18px;
}

.hint {
  margin-top: 20px;
  color: #6f8198;
  font: 700 9px 'Orbitron', sans-serif;
  letter-spacing: 1.5px;
}

.hint span {
  color: var(--red);
  padding: 0 7px;
}

/* --- RESULTS SECTION --- */
.results-section { padding: 4px 0 20px; }

.results-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 18px;
  margin: 0 0 20px;
}

.section-index {
  font: 700 10px 'Orbitron', sans-serif;
  letter-spacing: 2px;
  color: var(--cyan);
}

h2 {
  margin: 8px 0 0;
  font: 800 clamp(22px, 3vw, 32px) 'Syne', sans-serif;
}

.count {
  border: 1px solid var(--line);
  border-radius: 30px;
  padding: 8px 14px;
  color: var(--cyan);
  font: 700 9px 'Orbitron', sans-serif;
  letter-spacing: 1px;
  white-space: nowrap;
  background: rgba(0, 240, 255, 0.05);
}

.search-tabs {
  display: flex;
  gap: 9px;
  margin-bottom: 18px;
}

.search-tab {
  padding: 10px 20px;
  border-radius: 30px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.05);
  color: var(--muted);
  font: 700 12px 'Orbitron', sans-serif;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: all .25s ease;
}

.search-tab:hover, .search-tab.active {
  background: #fff;
  color: #080a10;
  border-color: white;
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
  transform: translateY(-2px);
}

.message {
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--panel);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  color: #a5b2c4;
  font-size: 16px;
  margin-bottom: 20px;
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

/* --- RESULT CARDS (Wird von search.js generiert) --- */
.result {
  width: 100%;
  display: flex;
  flex-direction: column;
  text-align: left;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: rgba(13, 17, 28, .68);
  backdrop-filter: blur(12px);
  color: inherit;
  cursor: pointer;
  transition: all .35s cubic-bezier(0.16, 1, 0.3, 1);
  text-decoration: none;
}

.result:hover {
  transform: translateY(-8px) scale(1.02);
  border-color: rgba(255, 0, 51, 0.5);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 0, 51, 0.2);
  background: rgba(20, 26, 42, 0.7);
}

.thumb-wrap {
  position: relative;
  aspect-ratio: 16/9;
  background: #090d14;
  overflow: hidden;
}

.thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.5s ease;
}

.result:hover .thumb-wrap img {
  transform: scale(1.08);
}

.playmark {
  position: absolute;
  right: 14px;
  bottom: 14px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--tesla), var(--red));
  color: #fff;
  font-size: 16px;
  box-shadow: 0 0 20px rgba(255, 0, 51, 0.6);
  transform: scale(0.85);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.result:hover .playmark {
  transform: scale(1.08);
  box-shadow: 0 0 30px rgba(255, 0, 51, 0.9);
}

.result-body {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.result-title {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font: 700 16px/1.3 'Rajdhani', sans-serif;
  color: #fff;
  min-height: 42px;
}

.result-channel {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
  font-weight: 600;
}

.result-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  font: 700 9px 'Orbitron', sans-serif;
  color: rgba(255, 255, 255, 0.4);
  letter-spacing: .1em;
}

.result-meta span:last-child { color: var(--cyan); }

/* --- CHANNEL RESULTS (Wird von search.js generiert) --- */
.channel-result {
  display: block;
  text-decoration: none;
  min-width: 0;
}

.channel-result .thumb-wrap {
  background: radial-gradient(circle at center, rgba(0, 240, 255, 0.1), rgba(13, 17, 28, 0.8));
}

.channel-result .thumb-wrap img {
  object-fit: contain;
  padding: 16px;
}

.channel-description {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  margin-top: 8px;
}

.load-status {
  min-height: 26px;
  padding: 20px 0;
  text-align: center;
  color: var(--cyan);
  font: 700 12px 'Orbitron', sans-serif;
  letter-spacing: 1px;
}

#load-sentinel { height: 2px; }

footer {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
  border-top: 1px solid var(--line);
  padding-top: 24px;
  margin-top: 40px;
  color: #65748a;
  font: 700 9px 'Orbitron', sans-serif;
  letter-spacing: 1.2px;
}

footer b { color: var(--red); }

@media(max-width:800px) {
  .results-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media(max-width:760px) {
  .shell { padding: 0 15px 30px; }
  .cyber-header { margin: 0 -15px; padding: 12px 15px; flex-wrap: wrap; gap: 12px; }
  .eyebrow { display: none; }
  .search-container { flex-basis: 100%; max-width: none; order: 2; }
  .brand { font-size: 16px; }
  .brand-mark { width: 34px; height: 34px; }
  .hero { margin: 22px 0; padding: 26px 21px; border-radius: 20px; }
  h1 { letter-spacing: -1px; }
  .intro { font-size: 16px; }
  .hint { line-height: 1.8; }
  .results-heading { align-items: center; }
  .results-grid { grid-template-columns: 1fr; gap: 15px; }
  .search-button { padding: 11px 15px; }
  .search-tab { flex: 1; text-align: center; }
}

@media(max-width:540px) {
  .results-grid { grid-template-columns: 1fr; gap: 13px; }
  .result { display: grid; grid-template-columns: 42% 1fr; }
  .thumb-wrap { height: 100%; aspect-ratio: auto; }
  .result-body { padding: 12px; }
  .result-title { font-size: 12px; min-height: 0; }
  .result-meta { margin-top: 10px; }
}
</style>
</head>
<body>


<main class="shell">
<header class="cyber-header">
  <a class="brand" href="/" aria-label="CYBER.play Startseite">
    <span class="brand-mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </span>
    <span>CYBER<em>.play</em></span>
  </a>
  <span class="eyebrow">PREMIUM</span>
  <div class="search-container">
    <form id="search-form" class="search-form">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="search-query" type="search" autocomplete="off" placeholder="Video, Musik oder Kanal suchen …" aria-label="YouTube durchsuchen" required maxlength="200">
      <button id="search-button" class="search-button" type="submit">SUCHEN <span>↗</span></button>
    </form>
  </div>
</header>

<section class="hero">
  <div class="overline"><span class="pulse"></span> YOUTUBE PREMIUM GERMANY</div>
  <h1>Find your<br><em>next signal.</em></h1>
  <p class="intro">Durchsuche Videos und Kanäle</p>
  <div class="hint">YOUTUBE SUCHE <span>·</span> KEINE WERBUNG <span>·</span> STREAMEN </div>
</section>

<section class="results-section">
  <div class="results-heading">
    <div>
      <span class="section-index">ERGEBNISSE</span>
      <h2 id="results-title">Entdecken</h2>
    </div>
    <div id="results-count" class="count">BEREIT</div>
  </div>
  <nav class="search-tabs" aria-label="Suchtyp">
    <button class="search-tab active" type="button" data-kind="video" aria-pressed="true">CONTENT</button>
    <button class="search-tab" type="button" data-kind="channel" aria-pressed="false">CREATOR</button>
  </nav>
  <div id="search-message" class="message" role="status" aria-live="polite">Gib oben einen Suchbegriff ein, um Videos oder Kanäle zu finden.</div>
  <div id="search-results" class="results-grid"></div>
  <div id="load-sentinel" aria-hidden="true"></div>
  <div id="load-status" class="load-status" aria-live="polite"></div>
</section>

<footer>
  <span>CYBER.play <b>●</b> SEARCH</span>
  <span>PLAYBACK OPENS IN A SEPARATE VIEW</span>
</footer>
</main>

<script src="/static/search.js?v=3" defer></script>
</body>
</html>
