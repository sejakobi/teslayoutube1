
<html lang="en">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f0f0f; }
    ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    /* Intro Animation Overlay */
    #intro-screen {
      position: fixed;
      inset: 0;
      background: #09090b;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #intro-screen.fade-out {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }
    .intro-logo-box {
      display: flex;
      align-items: center;
      gap: 16px;
      animation: pulseLogo 1.5s infinite alternate;
    }
    @keyframes pulseLogo {
      0% { transform: scale(0.95); filter: drop-shadow(0 0 10px rgba(255,0,51,0.3)); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(255,0,51,0.8)); }
    }
  </style>
</head>
<body class="bg-ytbg text-gray-100 font-sans h-screen flex flex-col overflow-hidden select-none">

  <!-- SPECTACULAR START ANIMATION SCREEN -->
  <div id="intro-screen">
    <div class="text-center flex flex-col items-center">
      <div class="intro-logo-box mb-4">
        <!-- YouTube Play Icon combined with Cyber Red Accent -->
        <div class="w-16 h-16 bg-cyberred rounded-2xl flex items-center justify-center shadow-2xl relative overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-tr from-black/30 to-transparent"></div>
          <svg class="w-9 h-9 text-white fill-current ml-1" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
        <div class="text-3xl md:text-5xl font-black tracking-wider text-white">
          CYBER<span class="text-cyberred">.play</span>
        </div>
      </div>
      <div class="text-xs uppercase tracking-[0.4em] text-gray-400 font-mono mb-8 animate-pulse">
        Initializing Secure Stream Network...
      </div>
      <!-- Loading Bar -->
      <div class="w-48 h-1.5 bg-neutral-800 rounded-full overflow-hidden">
        <div id="intro-progress" class="h-full bg-gradient-to-r from-cyberred to-cyberaccent w-0 transition-all duration-700"></div>
      </div>
    </div>
  </div>




    
  </header>

  <!-- MAIN APP CONTAINER (YouTube Studio / Dashboard Background + Auth Modal) -->
  <div class="flex flex-1 overflow-hidden relative">



    <!-- CONTENT DASHBOARD BACKGROUND (Simulated blurred YouTube Grid) -->
    <main class="flex-1 bg-[#0f0f0f] p-6 overflow-y-auto relative flex items-center justify-center">
      


      <!-- SOFT GLASSMORPHISM AUTH CARD (MODAL OVERLAY) -->
      <div id="card" class="relative z-10 w-full max-w-sm p-8 bg-neutral-900/80 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-[0_25px_60px_rgba(0,0,0,0.8),inset_0_1px_0_rgba(255,255,255,0.15)] flex flex-col items-center">
        
        <!-- Brand Header inside Card -->
        <div class="flex items-center gap-2 mb-1">
          <div class="w-7 h-7 bg-cyberred rounded-lg flex items-center justify-center shadow-md">
            <svg class="w-3.5 h-3.5 text-white fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <div id="brand" class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">CYBER.play</div>
        </div>
        <div id="subtitle" class="text-[10px] tracking-[0.25em] text-gray-400 uppercase font-mono mb-6">PREMIUM </div>

        <!-- PIN Dots Display -->
        <div id="pin-display" class="flex gap-3 mb-5 min-h-[16px] items-center justify-center"></div>

        <!-- Status Message Box -->
        <div id="msg" class="h-6 text-xs font-mono tracking-wide text-gray-400 mb-5 text-center flex items-center justify-center transition-all"></div>

        <!-- Interactive Keypad -->
        <div id="keypad" class="grid grid-cols-3 gap-3 w-full">
          <button class="key h-14 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white text-lg font-semibold transition-all active:scale-90" data-digit="1">1</button>
          <button class="key h-14 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white text-lg font-semibold transition-all active:scale-90" data-digit="2">2</button>
          <button class="key h-14 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white text-lg font-semibold transition-all active:scale-90" data-digit="3">3</button>
          <button class="key h-14 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white text-lg font-semibold transition-all active:scale-90" data-digit="4">4</button>
          <button class="key h-14 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white text-lg font-semibold transition-all active:scale-90" data-digit="5">5</button>
          <button class="key h-14 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white text-lg font-semibold transition-all active:scale-90" data-digit="6">6</button>
          <button class="key h-14 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white text-lg font-semibold transition-all active:scale-90" data-digit="7">7</button>
          <button class="key h-14 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white text-lg font-semibold transition-all active:scale-90" data-digit="8">8</button>
          <button class="key h-14 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white text-lg font-semibold transition-all active:scale-90" data-digit="9">9</button>
          <button class="key key-clear h-14 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-gray-400 text-xs font-bold tracking-wider transition-all active:scale-90" data-action="clear">LÖSCHEN</button>
          <button class="key key-zero h-14 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white text-lg font-semibold transition-all active:scale-90" data-digit="0">0</button>
          <button class="key key-submit h-14 bg-cyberred hover:bg-red-600 border border-red-500/50 rounded-2xl text-white text-xl font-bold shadow-lg shadow-red-600/30 transition-all active:scale-90 flex items-center justify-center" data-action="submit">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    /* --- Spectacular Start Animation Logic --- */
    window.addEventListener("DOMContentLoaded", () => {
      const progressBar = document.getElementById("intro-progress");
      const introScreen = document.getElementById("intro-screen");

      // Animate progress bar smoothly
      setTimeout(() => { progressBar.style.width = "60%"; }, 150);
      setTimeout(() => { progressBar.style.width = "100%"; }, 500);

      // Fade out intro screen after initialization
      setTimeout(() => {
        introScreen.classList.add("fade-out");
        setTimeout(() => introScreen.remove(), 600);
      }, 900);
    });

    /* --- PIN Logic & Functionality (Fully Intact) --- */
    (function () {
      const MAX_LEN = 8;
      let pin = "";
      let locked = false;

      const display = document.getElementById("pin-display");
      const msg     = document.getElementById("msg");
      const keys    = document.querySelectorAll(".key");

      function renderDots(len) {
        display.innerHTML = "";
        for (let i = 0; i < Math.max(len, 4); i++) {
          const d = document.createElement("div");
          d.className = "w-2.5 h-2.5 rounded-full border border-white/20 transition-all duration-200" + (i < len ? " bg-cyberred border-cyberred scale-125 shadow-[0_0_10px_rgba(255,0,51,0.6)]" : " bg-transparent");
          display.appendChild(d);
        }
      }

      function setMsg(text, cls) {
        msg.textContent = text;
        msg.className = "h-6 text-xs font-mono tracking-wide transition-all " + (cls || "text-gray-400");
      }

      function setDisabled(state) {
        keys.forEach(k => k.disabled = state);
      }

      renderDots(0);

      document.getElementById("keypad").addEventListener("click", function (e) {
        if (locked) return;
        const btn = e.target.closest(".key");
        if (!btn || btn.disabled) return;

        const digit  = btn.dataset.digit;
        const action = btn.dataset.action;

        if (digit !== undefined) {
          if (pin.length < MAX_LEN) {
            pin += digit;
            renderDots(pin.length);
            setMsg("");
          }
        } else if (action === "clear") {
          pin = "";
          renderDots(0);
          setMsg("");
        } else if (action === "submit") {
          if (pin.length === 0) { setMsg("ENTER PIN", "text-red-500 font-bold"); return; }
          submit();
        }
      });

      document.addEventListener("keydown", function (e) {
        if (locked) return;
        if (e.key >= "0" && e.key <= "9") {
          if (pin.length < MAX_LEN) {
            pin += e.key;
            renderDots(pin.length);
            setMsg("");
          }
        } else if (e.key === "Backspace") {
          pin = pin.slice(0, -1);
          renderDots(pin.length);
          setMsg("");
        } else if (e.key === "Enter") {
          submit();
        }
      });

      function submit() {
        setDisabled(true);
        setMsg("VERIFYING...", "text-yellow-400 animate-pulse");

        fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: pin }),
        })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
        .then(function (res) {
          if (res.status === 200) {
            setMsg("ACCESS GRANTED", "text-green-400 font-bold");
            setTimeout(function () { window.location.replace("/"); }, 300);
          } else if (res.status === 429) {
            locked = true;
            setDisabled(true);
            const secs = res.data.retry_after || 600;
            setMsg("LOCKED. WAIT " + Math.ceil(secs / 60) + " MIN.", "text-red-500 font-bold");
          } else {
            pin = "";
            renderDots(0);
            setDisabled(false);
            setMsg("INVALID PIN", "text-red-500 font-bold");
          }
        })
        .catch(function () {
          setDisabled(false);
          setMsg("NETWORK ERROR", "text-red-500 font-bold");
        });
      }
    })();
  </script>
</body>
</html>
