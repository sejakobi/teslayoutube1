<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ASCILINE — Enter PIN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --bg:        #030305;
      --surface:   rgba(255, 255, 255, 0.03);
      --surface-hover: rgba(255, 255, 255, 0.07);
      --border:    rgba(255, 255, 255, 0.08);
      --border-hi: rgba(255, 255, 255, 0.2);
      --accent:    #f5a623;
      --accent-glow: rgba(245, 166, 35, 0.35);
      --fg:        #f5f5f7;
      --fg-dim:    #86868b;
      --fg-faint:  #424245;
      --red:       #ff453a;
      --green:     #32d74b;
      --font-ui:   -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-ui);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Starfield Canvas Background */
    #starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Ambient Glow Effects (Tesla/Apple style) */
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(245,166,35,0.08) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }

    /* Main Glass Card */
    #card {
      position: relative;
      z-index: 2;
      width: 360px;
      padding: 36px 32px;
      background: rgba(18, 18, 22, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 8px;
      color: var(--fg);
      margin-bottom: 4px;
      user-select: none;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    #subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--fg-dim);
      text-transform: uppercase;
      margin-bottom: 28px;
      user-select: none;
    }

    /* PIN dots */
    #pin-display {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
      min-height: 16px;
      align-items: center;
      justify-content: center;
    }
    .pin-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid var(--border-hi);
      background: transparent;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pin-dot.filled {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      transform: scale(1.2);
    }

    /* Status message */
    #msg {
      height: 20px;
      font-size: 12px;
      font-family: var(--font-mono);
      letter-spacing: 1px;
      color: var(--fg-dim);
      margin-bottom: 20px;
      text-align: center;
      transition: color 0.3s ease;
    }
    #msg.error { color: var(--red); animation: shake 0.4s ease; }
    #msg.locked { color: var(--red); }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Keypad */
    #keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }
    .key {
      height: 64px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--fg);
      font-size: 22px;
      font-weight: 500;
      font-family: var(--font-ui);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    
    .key:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--border-hi);
      transform: translateY(-2px);
    }

    .key:active:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(0.92) translateY(0);
    }

    .key:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .key-clear {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--fg-dim);
    }
    
    .key-submit {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(245, 166, 35, 0.25);
    }
    
    .key-submit:hover:not(:disabled) {
      background: #ffb838;
      border-color: #ffb838;
      box-shadow: 0 6px 25px rgba(245, 166, 35, 0.4);
    }
  </style>
</head>
<body>

  <!-- Starfield Dynamic Background Animation -->
  <canvas id="starfield"></canvas>
  <div class="ambient-glow"></div>

  <div id="card">
    <div id="brand">ASCILINE</div>
    <div id="subtitle">Secure Authentication</div>

    <div id="pin-display"></div>
    <div id="msg"></div>

    <div id="keypad">
      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key key-clear" data-action="clear">CLR</button>
      <button class="key key-zero" data-digit="0">0</button>
      <button class="key key-submit" data-action="submit">&#10003;</button>
    </div>
  </div>

<script>
  /* --- Interactive Starfield Canvas Animation --- */
  const canvas = document.getElementById("starfield");
  const ctx = canvas.getContext("2d");

  let width, height;
  let stars = [];
  const numStars = window.innerWidth < 768 ? 60 : 120;

  function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  for (let i = 0; i < numStars; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.8 + 0.4,
      speed: Math.random() * 0.2 + 0.05,
      alpha: Math.random() * 0.7 + 0.3
    });
  }

  function animateStars() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "#ffffff";
    
    stars.forEach(star => {
      ctx.globalAlpha = star.alpha;
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fill();

      // Move star upwards / slightly floating effect
      star.y -= star.speed;
      if (star.y < 0) {
        star.y = height;
        star.x = Math.random() * width;
      }
    });

    requestAnimationFrame(animateStars);
  }
  animateStars();


  /* --- PIN Logic & Functionality --- */
  (function () {
    const MAX_LEN = 8;
    let pin = "";
    let locked = false;

    const display = document.getElementById("pin-display");
    const msg     = document.getElementById("msg");
    const keys    = document.querySelectorAll(".key");

    function renderDots(len) {
      display.innerHTML = "";
      for (let i = 0; i < Math.max(len, 4); i++) {
        const d = document.createElement("div");
        d.className = "pin-dot" + (i < len ? " filled" : "");
        display.appendChild(d);
      }
    }

    function setMsg(text, cls) {
      msg.textContent = text;
      msg.className = cls || "";
    }

    function setDisabled(state) {
      keys.forEach(k => k.disabled = state);
    }

    renderDots(0);

    document.getElementById("keypad").addEventListener("click", function (e) {
      if (locked) return;
      const btn = e.target.closest(".key");
      if (!btn || btn.disabled) return;

      const digit  = btn.dataset.digit;
      const action = btn.dataset.action;

      if (digit !== undefined) {
        if (pin.length < MAX_LEN) {
          pin += digit;
          renderDots(pin.length);
          setMsg("");
        }
      } else if (action === "clear") {
        pin = "";
        renderDots(0);
        setMsg("");
      } else if (action === "submit") {
        if (pin.length === 0) { setMsg("ENTER PIN", "error"); return; }
        submit();
      }
    });

    document.addEventListener("keydown", function (e) {
      if (locked) return;
      if (e.key >= "0" && e.key <= "9") {
        if (pin.length < MAX_LEN) {
          pin += e.key;
          renderDots(pin.length);
          setMsg("");
        }
      } else if (e.key === "Backspace") {
        pin = pin.slice(0, -1);
        renderDots(pin.length);
        setMsg("");
      } else if (e.key === "Enter") {
        submit();
      }
    });

    function submit() {
      setDisabled(true);
      setMsg("VERIFYING...", "");

      fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: pin }),
      })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
      .then(function (res) {
        if (res.status === 200) {
          setMsg("ACCESS GRANTED", "");
          setTimeout(function () { window.location.replace("/"); }, 300);
        } else if (res.status === 429) {
          locked = true;
          setDisabled(true);
          const secs = res.data.retry_after || 600;
          setMsg("LOCKED. WAIT " + Math.ceil(secs / 60) + " MIN.", "locked");
        } else {
          pin = "";
          renderDots(0);
          setDisabled(false);
          setMsg("INVALID PIN", "error");
        }
      })
      .catch(function () {
        setDisabled(false);
        setMsg("NETWORK ERROR", "error");
      });
    }
  })();
</script>
</body>
</html>
