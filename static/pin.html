<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>CYBER.play — AUTH SYSTEM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020408">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* --- CYBER.PLAY CORE THEME --- */
    :root {
      color-scheme: dark;
      --bg: #020408;
      --panel: rgba(13, 17, 28, 0.65);
      --panel-border: rgba(255, 255, 255, 0.1);
      --yt-red: #ff0033;
      --tesla-red: #e82127;
      --cyber-cyan: #00f0ff;
      --text-main: #f0f4f9;
      --text-muted: #8392a7;
      --red: #ff3355;
      --green: #00ffaa;
      --blur-val: 20px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(232, 33, 39, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
        linear-gradient(to bottom, rgba(2,4,8,0.8), #020408);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    /* --- TESLA x YOUTUBE INTRO ANIMATION --- */
    #cyber-intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: introFadeOut 0.8s cubic-bezier(0.77, 0, 0.175, 1) 2.6s forwards;
      pointer-events: none;
    }

    .intro-logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }

    .tesla-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 0.6em;
      color: var(--tesla-red);
      text-transform: uppercase;
      opacity: 0;
      animation: pulseText 1.5s ease-in-out 0.2s infinite alternate, fadeIn 0.4s 0.1s forwards;
    }

    .cyber-brand-intro {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
      text-shadow: 0 0 30px rgba(255, 0, 51, 0.6);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: scale(0.9);
      animation: zoomInLogo 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .cyber-brand-intro span {
      color: var(--yt-red);
    }

    .intro-progress-bar {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 15px;
    }

    .intro-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--tesla-red), var(--yt-red), var(--cyber-cyan));
      box-shadow: 0 0 15px var(--yt-red);
      animation: fillProgress 1.8s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards;
    }

    @keyframes fillProgress { 0% { width: 0%; } 100% { width: 100%; } }
    @keyframes zoomInLogo { to { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes pulseText { from { opacity: 0.4; } to { opacity: 1; text-shadow: 0 0 10px var(--tesla-red); } }
    @keyframes introFadeOut { to { opacity: 0; visibility: hidden; } }

    /* --- GLASS CARD --- */
    #card {
      width: 360px;
      padding: 36px 28px;
      background: var(--panel);
      backdrop-filter: blur(var(--blur-val));
      -webkit-backdrop-filter: blur(var(--blur-val));
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 0, 51, 0.1);
      position: relative;
      z-index: 10;
    }

    /* --- BRANDING --- */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--tesla-red), var(--yt-red));
      border-radius: 10px;
      display: grid;
      place-items: center;
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.5);
    }

    .brand-icon svg {
      width: 16px;
      height: 16px;
      fill: #fff;
    }

    #brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      user-select: none;
    }

    #brand span {
      color: var(--yt-red);
    }

    #subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--cyber-cyan);
      text-transform: uppercase;
      margin-bottom: 28px;
      user-select: none;
      background: rgba(0, 240, 255, 0.08);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    /* --- PIN DOTS --- */
    #pin-display {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      min-height: 24px;
      align-items: center;
      justify-content: center;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      transition: all 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pin-dot.filled {
      background: var(--yt-red);
      border-color: var(--yt-red);
      box-shadow: 0 0 15px var(--yt-red);
      transform: scale(1.15);
    }

    /* --- STATUS MESSAGE --- */
    #msg {
      height: 22px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 24px;
      text-align: center;
      text-transform: uppercase;
    }

    #msg.error, #msg.locked {
      color: var(--red);
      text-shadow: 0 0 10px rgba(255, 51, 85, 0.5);
    }

    /* --- KEYPAD --- */
    #keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .key {
      height: 62px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .key:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .key:active:not(:disabled) {
      transform: scale(0.92);
      background: rgba(255, 0, 51, 0.2);
      border-color: var(--yt-red);
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.4);
    }

    .key:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .key-clear {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    .key-submit {
      background: linear-gradient(135deg, var(--tesla-red), var(--yt-red));
      border: none;
      color: #fff;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(255, 0, 51, 0.3);
    }

    .key-submit:hover:not(:disabled) {
      box-shadow: 0 6px 20px rgba(255, 0, 51, 0.6);
      transform: translateY(-2px) scale(1.02);
    }
  </style>
</head>
<body>
<!-- TESLA x YOUTUBE BOOTUP ANIMATION -->
<div id="cyber-intro">
  <div class="intro-logo-wrap">
    <div class="tesla-badge">TESLA × YOUTUBE MEDIA SYSTEM</div>
    <div class="cyber-brand-intro">CYBER<span>.play</span></div>
    <div class="intro-progress-bar">
      <div class="intro-progress-fill"></div>
    </div>
  </div>
</div>

  <!-- AUTH CARD -->
  <div id="card">
    <div class="brand-header">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div id="brand">CYBER<span>.play</span></div>
    </div>
    <div id="subtitle">PASSWORT</div>

    <div id="pin-display"></div>
    <div id="msg"></div>

    <div id="keypad">
      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key key-clear" data-action="clear">LÖSCHEN</button>
      <button class="key key-zero" data-digit="0">0</button>
      <button class="key key-submit" data-action="submit">&#10003;</button>
    </div>
  </div>

  <script>
  (function () {
    const MAX_LEN = 8;
    let pin = "";
    let locked = false;

    const display = document.getElementById("pin-display");
    const msg     = document.getElementById("msg");
    const keys    = document.querySelectorAll(".key");

    function renderDots(len) {
      display.innerHTML = "";
      for (let i = 0; i < Math.max(len, 4); i++) {
        const d = document.createElement("div");
        d.className = "pin-dot" + (i < len ? " filled" : "");
        display.appendChild(d);
      }
    }

    function setMsg(text, cls) {
      msg.textContent = text;
      msg.className = cls || "";
    }

    function setDisabled(state) {
      keys.forEach(k => k.disabled = state);
    }

    renderDots(0);

    document.getElementById("keypad").addEventListener("click", function (e) {
      if (locked) return;
      const btn = e.target.closest(".key");
      if (!btn || btn.disabled) return;

      const digit  = btn.dataset.digit;
      const action = btn.dataset.action;

      if (digit !== undefined) {
        if (pin.length < MAX_LEN) {
          pin += digit;
          renderDots(pin.length);
          setMsg("");
        }
      } else if (action === "clear") {
        pin = "";
        renderDots(0);
        setMsg("");
      } else if (action === "submit") {
        if (pin.length === 0) { setMsg("Enter your PIN", ""); return; }
        submit();
      }
    });

    // Support physical keyboard for desktop testing
    document.addEventListener("keydown", function (e) {
      if (locked) return;
      if (e.key >= "0" && e.key <= "9") {
        if (pin.length < MAX_LEN) {
          pin += e.key;
          renderDots(pin.length);
          setMsg("");
        }
      } else if (e.key === "Backspace") {
        pin = pin.slice(0, -1);
        renderDots(pin.length);
        setMsg("");
      } else if (e.key === "Enter") {
        submit();
      }
    });

    function submit() {
      setDisabled(true);
      setMsg("Checking…", "");

      fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin: pin }),
      })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
      .then(function (res) {
        if (res.status === 200) {
          setMsg("OK", "");
          setTimeout(function () { window.location.replace("/"); }, 300);
        } else if (res.status === 429) {
          locked = true;
          setDisabled(true);
          const secs = res.data.retry_after || 600;
          setMsg("Too many attempts. Wait " + Math.ceil(secs / 60) + " min.", "locked");
        } else {
          pin = "";
          renderDots(0);
          setDisabled(false);
          setMsg("Wrong PIN", "error");
        }
      })
      .catch(function () {
        setDisabled(false);
        setMsg("Network error", "error");
      });
    }
  })();
  </script>
</body>
</html>
