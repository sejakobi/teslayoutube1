<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="color-scheme" content="light dark">
  <title>ASCILINE</title>
  <link rel="stylesheet" href="/static/style.css?v=apple-rebuild-1">
  <link rel="stylesheet" href="/static/watch.css?v=apple-rebuild-1">
</head>
<body class="watch-page">
  <header id="topbar">
    <a id="brand" href="/" aria-label="ASCILINE Startseite">ASCILINE</a>
    <input id="query-input" type="text" aria-label="Suchbegriff" autocomplete="off">
    <button id="btn-search" class="hidden" type="button">Suchen</button>
    <button id="btn-play" class="hidden" type="button">Start</button>
    <button id="btn-stop" class="hidden" type="button">Stop</button>
  </header>
  <div id="subbar">
    <div id="preset-group" role="group" aria-label="Qualität">
      <button class="preset-btn active" data-preset="low" type="button">Low</button>
      <button class="preset-btn" data-preset="med" type="button">Medium</button>
      <button class="preset-btn" data-preset="high" type="button">High</button>
    </div>
    <div id="display-mode-group" role="group" aria-label="Darstellung">
      <button class="display-mode-btn" data-display-mode="ascii" type="button">ASCII</button>
      <button class="display-mode-btn active" data-display-mode="canvas" type="button">Canvas</button>
    </div>
    <div id="preset-hint" class="hidden"></div>
    <div id="volume-group">
      <button id="btn-mute" type="button" aria-label="Ton umschalten">◖</button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" aria-label="Lautstärke">
    </div>
  </div>
  <section id="search-panel" class="hidden">
    <div id="search-message"></div><div id="search-results"></div>
    <button id="btn-close-search" type="button" aria-label="Suche schließen">Schließen</button>
  </section>
  <main id="player-container">
    <pre id="ascii-player"></pre>
    <canvas id="ascii-canvas" aria-label="ASCILINE Bildfläche"></canvas>
    <video id="canvas-source" playsinline preload="auto" aria-hidden="true"></video>
    <div id="idle-overlay"><div id="idle-content">
      <div id="idle-logo">ASCILINE</div><div id="idle-sub">A quieter kind of screen.</div>
      <div id="idle-arrow">Wähle ein Video und starte die Wiedergabe.</div>
    </div></div>
    <div id="watch-chrome"><a href="/" class="back-link">← Suche</a><div class="watch-wordmark">ASCILINE <span>CANVAS VIEW</span></div></div>
    <button id="watch-start" class="start-overlay" type="button"><span class="start-icon">▶</span><span>Wiedergabe starten</span><small>Canvas · separater Ton</small></button>
    <div id="watch-error" role="status" aria-live="polite"></div>
  </main>
  <footer id="statusbar"><span id="status-title" class="status-segment"></span><span id="status-live" class="live-badge hidden">● LIVE</span><span id="status-state" class="status-segment status-state">Bereit</span><span id="status-fps" class="status-segment status-fps"></span><span id="status-perf-hint" class="status-segment status-perf hidden"></span></footer>
  <audio id="ascii-audio" preload="auto"></audio>
  <script src="/static/app.js?v=apple-rebuild-1" defer></script>
</body></html>
