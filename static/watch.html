```html
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <meta name="color-scheme" content="dark">
  <title>ASCILINE</title>
  <link rel="stylesheet" href="/static/style.css?v=watch-rebuild-2">
  <link rel="stylesheet" href="/static/watch.css?v=watch-rebuild-2">
</head>
<body class="watch-page">
  <header id="topbar">
    <a id="brand" href="/" aria-label="ASCILINE Startseite">ASCILINE</a>
    <input id="query-input" type="text" aria-label="Suchbegriff">
    <button id="btn-search" class="hidden" type="button">SEARCH</button>
    <button id="btn-play" class="hidden" type="button">PLAY</button>
    <button id="btn-stop" class="hidden" type="button">STOP</button>
  </header>

  <div id="subbar">
    <div id="preset-group" aria-label="Qualitätsstufe">
      <button class="preset-btn active" data-preset="low" type="button">LOW</button>
      <button class="preset-btn" data-preset="med" type="button">MED</button>
      <button class="preset-btn" data-preset="high" type="button">HIGH</button>
    </div>

    <div id="display-mode-group" aria-label="Darstellungsmodus">
      <button class="display-mode-btn" data-display-mode="ascii" type="button">ASCII</button>
      <button class="display-mode-btn active" data-display-mode="canvas" type="button">CANVAS</button>
    </div>

    <div id="preset-hint" class="hidden"></div>

    <div id="volume-group">
      <button id="btn-mute" type="button" aria-label="Ton umschalten">🔊</button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" aria-label="Lautstärke">
    </div>
  </div>

  <section id="search-panel" class="hidden">
    <div id="search-message"></div>
    <div id="search-results"></div>
    <button id="btn-close-search" type="button" aria-label="Suche schließen">✕</button>
  </section>

  <main id="player-container">
    <pre id="ascii-player"></pre>
    <canvas id="ascii-canvas" aria-label="ASCILINE Anzeige"></canvas>

    <div id="idle-overlay">
      <div id="idle-content">
        <div id="idle-logo">ASCILINE</div>
        <div id="idle-sub">VISUAL INTERFACE</div>
        <div id="idle-arrow">Bereit</div>
      </div>
    </div>

    <div id="watch-chrome">
      <a href="/" class="back-link">← ZURÜCK</a>
      <div class="watch-wordmark">ASCILINE <span>VISUAL EXPERIENCE</span></div>
    </div>

    <button id="watch-start" class="start-overlay" type="button">
      <span class="start-icon">▶</span>
      <span>STARTEN</span>
      <small>INTERAKTIVE ANSICHT</small>
    </button>

    <div id="watch-error" role="status" aria-live="polite"></div>
  </main>

  <footer id="statusbar">
    <span id="status-title" class="status-segment"></span>
    <span id="status-live" class="live-badge hidden">● LIVE</span>
    <span id="status-state" class="status-segment status-state">READY</span>
    <span id="status-fps" class="status-segment status-fps"></span>
    <span id="status-perf-hint" class="status-segment status-perf hidden"></span>
  </footer>

  <audio id="ascii-audio" preload="auto"></audio>

  <script src="/static/app.js?v=watch-rebuild-2" defer></script>
</body>
</html>
