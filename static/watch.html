<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101214">
  <meta name="color-scheme" content="dark">
  <title>ASCILINE Media Hub</title>
  <link rel="stylesheet" href="/static/style.css?v=webcodecs-canvas-3">
  <link rel="stylesheet" href="/static/watch.css?v=asciline-media-hub-3">
</head>
<body class="watch-page">
  <header id="topbar">
    <a id="brand" href="/" aria-label="ASCILINE Startseite">ASCILINE</a>
    <input id="query-input" type="text" aria-label="Suchbegriff" autocomplete="off">
    <button id="btn-search" class="hidden" type="button">Suchen</button>
    <button id="btn-play" class="hidden" type="button">Start</button>
    <button id="btn-stop" class="hidden" type="button">← Zurück zur Suche</button>
  </header>

  <div id="subbar">
    <div id="preset-group" role="group" aria-label="Qualität">
      <button class="preset-btn active" data-preset="low" type="button">Low</button>
      <button class="preset-btn" data-preset="med" type="button">Medium</button>
      <button class="preset-btn" data-preset="high" type="button">High</button>
    </div>

    <div id="display-mode-group" role="group" aria-label="Darstellung">
      <button class="display-mode-btn" data-display-mode="ascii" type="button">ASCII</button>
      <button class="display-mode-btn active" data-display-mode="canvas" type="button">Canvas</button>
    </div>

    <!-- Custom Canvas Transport-Steuerung (Play/Pause & Fortschrittsbalken ohne HTMLMediaElement) -->
    <div id="playback-controls" class="playback-controls hidden" role="group" aria-label="Wiedergabesteuerung">
      <button id="btn-pause" type="button" aria-label="Pause">Ⅱ</button>
      <span id="playback-current-time" class="playback-time">0:00</span>
      <input id="playback-progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Fortschritt">
      <span id="playback-duration" class="playback-time">0:00</span>
    </div>

    <div id="preset-hint" class="hidden"></div>

    <div id="volume-group">
      <button id="btn-mute" type="button" aria-label="Ton umschalten">🔊</button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" aria-label="Lautstärke">
    </div>
  </div>

  <section id="search-panel" class="hidden">
    <div id="search-message"></div>
    <div id="search-results"></div>
    <button id="btn-close-search" type="button" aria-label="Suche schließen">Schließen</button>
  </section>

  <main id="player-container">
    <pre id="ascii-player"></pre>
    <canvas id="ascii-canvas" aria-label="ASCILINE Bildfläche"></canvas>
    <div id="idle-overlay">
      <div id="idle-content">
        <div id="idle-logo">ASCILINE</div>
        <div id="idle-sub">ASCILINE MEDIA HUB</div>
        <div id="idle-arrow">Die ausgewählte Wiedergabe wird vorbereitet.</div>
      </div>
    </div>
    <div id="watch-chrome">
      <a href="/" class="back-link">← Suche</a>
      <div class="watch-wordmark">ASCILINE <span>CANVAS VIEW</span></div>
    </div>
    <div id="watch-error" class="hidden" role="status" aria-live="polite"></div>
  </main>

  <footer id="statusbar">
    <span id="status-title" class="status-segment"></span>
    <span id="status-live" class="live-badge hidden">● LIVE</span>
    <span id="status-state" class="status-segment status-state">Bereit</span>
    <span id="status-fps" class="status-segment status-fps"></span>
    <span id="status-perf-hint" class="status-segment status-perf hidden"></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.4/dist/mp4box.all.min.js"></script>
  <script src="/static/app.js?v=asciline-stealth-controls-3" defer></script>
</body>
</html>
