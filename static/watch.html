<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <title>ASCILINE Media Hub</title>
  <link rel="stylesheet" href="/static/style.css?v=webcodecs-canvas-2">
  <link rel="stylesheet" href="/static/watch.css?v=asciline-media-hub-2">
</head>
<body class="watch-page">
  <header id="topbar">
    <a id="brand" href="/" aria-label="ASCILINE Startseite">ASCILINE</a>
    <input id="query-input" type="text" autocomplete="off">
    <button id="btn-stop" class="hidden" type="button">← Zurück zur Suche</button>
  </header>
  
  <div id="subbar">
    <div id="preset-group" role="group" aria-label="Qualität">
      <button class="preset-btn active" data-preset="low" type="button">Low</button>
      <button class="preset-btn" data-preset="med" type="button">Medium</button>
      <button class="preset-btn" data-preset="high" type="button">High</button>
    </div>
    
    <!-- Diskrete Steuerungsleiste (Play/Pause & Fortschritt) -->
    <div id="playback-controls" class="hidden" style="display:flex; align-items:center; gap:10px; flex:1; max-width:400px; margin:0 15px;">
      <button id="btn-pause" type="button" class="preset-btn" style="min-width:36px;">Ⅱ</button>
      <span id="playback-current-time" style="font-size:11px; color:var(--ui-muted);">0:00</span>
      <input type="range" id="playback-progress" min="0" max="1000" value="0" style="flex:1; accent-color:var(--ui-accent); cursor:pointer;">
      <span id="playback-duration" style="font-size:11px; color:var(--ui-muted);">0:00</span>
    </div>

    <div id="preset-hint" class="hidden"></div>
    <div id="volume-group">
      <button id="btn-mute" type="button" aria-label="Ton umschalten">🔊</button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" aria-label="Lautstärke">
    </div>
  </div>

  <main id="player-container">
    <pre id="ascii-player"></pre>
    <canvas id="ascii-canvas" aria-label="ASCILINE Bildfläche"></canvas>
    <div id="idle-overlay"><div id="idle-content">
      <div id="idle-logo">ASCILINE</div><div id="idle-sub">SECURE MEDIA HUB</div>
      <div id="idle-arrow">Wiedergabe wird gestartet …</div>
    </div></div>
  </main>
  
  <footer id="statusbar">
    <span id="status-title" class="status-segment"></span>
    <span id="status-state" class="status-segment status-state">Bereit</span>
    <span id="status-fps" class="status-segment status-fps"></span>
    <span id="status-perf-hint" class="status-segment status-perf hidden"></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.4/dist/mp4box.all.min.js"></script>
  <script src="/static/app.js?v=asciline-controls-1" defer></script>
</body>
</html>
