<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="color-scheme" content="dark">
  <title>Video Player</title>
  <style>
/* --- CYBER.PLAY CORE THEME --- */
    :root {
      color-scheme: dark;
      --bg: #020408;
      --panel: rgba(13, 17, 28, 0.75);
      --panel-border: rgba(255, 255, 255, 0.1);
      --yt-red: #ff0033;
      --tesla-red: #e82127;
      --cyber-cyan: #00f0ff;
      --text-main: #f0f4f9;
      --text-muted: #8392a7;
      --red: #ff3355;
      --blur-val: 20px;
    }

    .watch-page {
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background-color: var(--bg) !important;
      color: var(--text-main) !important;
      font-family: 'Rajdhani', sans-serif !important;
    }

    /* Ausblenden der Standard-Leisten im Vollbildmodus */
    .watch-page #topbar,
    .watch-page #subbar,
    .watch-page #statusbar,
    .watch-page #search-panel {
      display: none !important;
    }

    /* Vollbild Player Container */
    .watch-page #player-container {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      min-height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      background-color: #000 !important;
      overflow: hidden !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .watch-page #ascii-canvas {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      display: block;
    }

    .watch-page #ascii-player {
      display: none !important;
    }

    /* --- Futuristischer CYBER.play Ladebildschirm --- */
    .watch-page #idle-overlay {
      position: absolute !important;
      inset: 0 !important;
      background: radial-gradient(circle at center, rgba(13, 17, 28, 0.95) 0%, #020408 85%) !important;
      backdrop-filter: blur(var(--blur-val));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .watch-page #idle-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Futuristischer Dual-Ring Neon Spinner */
    .watch-page #idle-content::before {
      content: "";
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 0, 51, 0.15);
      border-top: 3px solid var(--yt-red);
      border-right: 3px solid var(--cyber-cyan);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      box-shadow: 0 0 20px rgba(255, 0, 51, 0.4);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .watch-page #idle-logo {
      font-family: 'Orbitron', sans-serif !important;
      font-size: clamp(28px, 5vw, 52px) !important;
      font-weight: 900 !important;
      letter-spacing: 2px !important;
      color: #fff !important;
      text-shadow: 0 0 25px rgba(255, 0, 51, 0.6);
    }

    .watch-page #idle-sub {
      font-family: 'Orbitron', sans-serif !important;
      font-size: 11px !important;
      letter-spacing: 4px !important;
      color: var(--cyber-cyan) !important;
      text-transform: uppercase;
      background: rgba(0, 240, 255, 0.08);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }

    .watch-page #idle-arrow {
      font-size: 13px !important;
      color: var(--text-muted) !important;
      letter-spacing: 1px;
    }

    /* --- Oberes Glass Overlay (Zurück-Link & Wordmark) --- */
    .watch-page #watch-chrome {
      position: absolute;
      z-index: 5;
      inset: 0 0 auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 32px;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(2, 4, 8, 0.9), transparent);
    }

    .watch-page .back-link {
      pointer-events: auto;
      color: #fff;
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      border: 1px solid var(--panel-border);
      padding: 10px 20px;
      border-radius: 30px;
      background: rgba(13, 17, 28, 0.6);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }

    .watch-page .back-link:hover {
      background: var(--yt-red);
      border-color: var(--yt-red);
      box-shadow: 0 0 20px rgba(255, 0, 51, 0.6);
      transform: translateY(-2px);
    }

    .watch-page .watch-wordmark {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 1.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .watch-page .watch-wordmark span {
      font-size: 10px;
      color: var(--cyber-cyan);
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 3px 10px;
      border-radius: 12px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
    }

    /* --- Start-Overlay (Schwebender Cyber-Play Button) --- */
    .watch-page .start-overlay {
      position: absolute;
      z-index: 7;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 28px 40px;
      background: var(--panel);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 0, 51, 0.2);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .watch-page .start-overlay:hover {
      background: rgba(22, 30, 48, 0.85);
      border-color: var(--yt-red);
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 0, 51, 0.4);
    }

    .watch-page .start-icon {
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--tesla-red), var(--yt-red));
      color: #fff;
      font-size: 22px;
      padding-left: 4px;
      box-shadow: 0 0 25px rgba(255, 0, 51, 0.6);
    }

    .watch-page .start-overlay small {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .watch-page .start-overlay.hidden {
      display: none !important;
    }

    /* --- Error Banner --- */
    .watch-page #watch-error {
      position: absolute;
      z-index: 8;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      max-width: 90vw;
      color: var(--red);
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      text-align: center;
      background: rgba(13, 17, 28, 0.85);
      backdrop-filter: blur(15px);
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 51, 85, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .watch-page #idle-overlay.hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .watch-page #watch-chrome { padding: 16px; }
      .watch-page .watch-wordmark span { display: none; }
      .watch-page .start-overlay { white-space: nowrap; padding: 20px 28px; }
    }

    /* Utility-Klasse */
    .hidden { display: none !important; }
  </style>
</head>
<body class="watch-page">
  <header id="topbar">
    <a id="brand" href="/" aria-label="Startseite">Player</a>
    <input id="query-input" type="text" aria-label="Suchbegriff" autocomplete="off">
    <button id="btn-search" class="hidden" type="button">Suchen</button>
    <button id="btn-play" class="hidden" type="button">Start</button>
    <button id="btn-stop" class="hidden" type="button">Stop</button>
  </header>
  <div id="subbar">
    <div id="preset-group" role="group" aria-label="Qualität">
      <button class="preset-btn active" data-preset="low" type="button">Low</button>
      <button class="preset-btn" data-preset="med" type="button">Medium</button>
      <button class="preset-btn" data-preset="high" type="button">High</button>
    </div>
    <div id="display-mode-group" role="group" aria-label="Darstellung">
      <button class="display-mode-btn" data-display-mode="ascii" type="button">ASCII</button>
      <button class="display-mode-btn active" data-display-mode="canvas" type="button">Canvas</button>
    </div>
    <div id="preset-hint" class="hidden"></div>
    <div id="volume-group">
      <button id="btn-mute" type="button" aria-label="Ton umschalten">◖</button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" aria-label="Lautstärke">
    </div>
  </div>
  <section id="search-panel" class="hidden">
    <div id="search-message"></div><div id="search-results"></div>
    <button id="btn-close-search" type="button" aria-label="Suche schließen">Schließen</button>
  </section>
  <main id="player-container">
    <pre id="ascii-player"></pre>
    <canvas id="ascii-canvas" aria-label="Bildfläche"></canvas>
    <div id="idle-overlay">
      <div id="idle-content">
        <div id="idle-logo"></div>
        <div id="idle-sub"></div>
        <div id="idle-arrow"></div>
      </div>
    </div>
    <div id="watch-chrome">
      <a href="/" class="back-link">← Zurück</a>
      <div class="watch-wordmark">PLAYER <span>HD</span></div>
    </div>
    <div id="watch-error" role="status" aria-live="polite"></div>
  </main>
  <footer id="statusbar">
    <span id="status-title" class="status-segment"></span>
    <span id="status-live" class="live-badge hidden">● LIVE</span>
    <span id="status-state" class="status-segment status-state">Bereit</span>
    <span id="status-fps" class="status-segment status-fps"></span>
    <span id="status-perf-hint" class="status-segment status-perf hidden"></span>
  </footer>
  <audio id="ascii-audio" preload="auto"></audio>
  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.4/dist/mp4box.all.min.js"></script>
  <script src="/static/app.js?v=webcodecs-canvas-1" defer></script>
</body>
</html>
